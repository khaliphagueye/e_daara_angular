<mat-card appearance="outlined" class="small-card">
  <div *ngIf="course" class="course-details">
    <mat-card class="course-card">
      <mat-card-header>
        <mat-card-title>
          <h2>Titre: {{ course.titre }}</h2>
          <p class=""><i class="bi bi-reception-4"></i>&nbsp;<b>{{ course.niveau }}</b></p>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="course-info">
          <p><strong>Prérequis:</strong> {{ course.prerequis }}</p>
          <p><strong>Module:</strong> {{ course.module }}</p>
          <p><strong>Module:</strong> {{ course.module }}</p>
            <img [src]="course.image" alt="{{ course.titre }}" style="width: 100px; height: auto;" />
          

          <!-- Afficher seulement une partie du contenu -->
          <div class="formatted-text" [innerHTML]="truncatedContent | lineBreak"></div>
        </div>
      </mat-card-content>
    </mat-card>
    <br>
    <!-- Bouton pour commencer le cours -->
    <div style="text-align:center">
      <button (click)="commencerCours()" type="button" class="btn btn-outline-info add-course-btn">
        Commencer le cours
      </button>
    </div>
  </div>
  <br>
</mat-card>
